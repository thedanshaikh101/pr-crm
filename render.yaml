# Render Blueprint: web app, background worker, Postgres and Key Value (Redis).
# In Render: New + > Blueprint > pick this repo and branch > Apply.
envVarGroups:
  - name: pressdesk-shared
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: console
      - key: STORAGE_DRIVER
        value: local
      - key: NEWSROOM_DOMAIN
        value: newsroom.localhost
      - key: SUPERADMIN_EMAILS
        sync: false

services:
  - type: web
    name: pressdesk
    runtime: docker
    plan: starter
    healthCheckPath: /api/healthz
    disk:
      name: pressdesk-files
      mountPath: /app/.storage
      sizeGB: 5
    envVars:
      - fromGroup: pressdesk-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pressdesk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pressdesk-redis
          property: connectionString
      - key: SEED_DEMO
        value: "1"

  - type: worker
    name: pressdesk-worker
    runtime: docker
    plan: starter
    dockerCommand: sh scripts/worker.sh
    envVars:
      - fromGroup: pressdesk-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pressdesk-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pressdesk-redis
          property: connectionString
      - key: APP_URL
        sync: false

  - type: keyvalue
    name: pressdesk-redis
    plan: free
    ipAllowList: []

databases:
  - name: pressdesk-db
    plan: basic-256mb
